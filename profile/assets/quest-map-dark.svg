<title id="t">AI Season quest map — 12 levels in 6 worlds</title>
<desc id="d">Course path: 1 Agent Foundations, 2 Prompt Engineering and Vibe Coding, 3 RAG and Vector Databases, 4 Design Patterns, 5 LangChain and LangGraph, 6 Mid Test boss, 7 Deployment, 8 Security and Guardrails, 9 MCP and Agent SDK, 10 Voice Agent, 11 Excalidraw Capstone, 12 Final Test boss. Reward: full refund for the top 3 and a verifiable certificate.</desc>
<style>
.dash{stroke-dasharray:10 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pu 1.6s ease-out infinite}
@keyframes pu{0%{transform:scale(1);opacity:1}100%{transform:scale(1.9);opacity:0}}
.blink{animation:bl 1.1s steps(1) infinite}
@keyframes bl{60%{opacity:.2}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
